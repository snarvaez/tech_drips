<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Transcript Search{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/mongodb-leaf.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=mdb3">
</head>
<body>
  <div class="bg-pattern" aria-hidden="true">
    <div class="grid-overlay"></div>
    <div class="scanlines"></div>
    <div class="grain"></div>
  </div>
  <div class="hud-corner hud-corner-tl" aria-hidden="true"></div>
  <div class="hud-corner hud-corner-br" aria-hidden="true"></div>

  <nav class="topbar">
    <div class="topbar-inner">
      <a href="{{ url_for('main.index') }}" class="topbar-brand">
        <img src="{{ url_for('static', filename='img/mongodb-leaf.png') }}" alt="">
        mongodb <span class="brand-accent">/</span> transcripts
      </a>
      <div class="topbar-links">
        <span class="topbar-status"><span class="status-dot"></span>SYS:ONLINE</span>
        <span class="topbar-clock" id="topbar-clock"></span>
        {% block topbar_links %}{% endblock %}
      </div>
    </div>
  </nav>

  <div class="shell">
    {% block body %}{% endblock %}
  </div>
  <script>
    (function () {
      var el = document.getElementById("topbar-clock");
      if (!el) return;
      function tick() {
        var d = new Date();
        var pad = function (n) { return n < 10 ? "0" + n : String(n); };
        el.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
  {% block scripts %}
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=drip1"></script>
  {% endblock %}
</body>
</html>
