{% extends "base.html" %}
{% block title %}Play clip · Transcript Search{% endblock %}
{% block body %}
<header class="mast">
  <p class="kicker"><a href="{{ url_for('main.index') }}">Transcript Search</a></p>
  <h1 id="listen-title">Loading clip…</h1>
  <p class="lede" id="listen-meta"></p>
  <p class="status" id="listen-status">Seeking to the matched moment.</p>
  <div class="player listen-player">
    <audio id="clip-audio" controls preload="auto"></audio>
  </div>
</header>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/listen.js') }}?v=mdb1"></script>
{% endblock %}
