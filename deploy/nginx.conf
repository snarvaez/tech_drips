# Reverse proxy in front of Gunicorn (127.0.0.1:8000).
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/podcast-search
#          sudo ln -s /etc/nginx/sites-available/podcast-search /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream podcast_search {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;

    location /static/ {
        alias /var/www/podcast-search/search_app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://podcast_search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
